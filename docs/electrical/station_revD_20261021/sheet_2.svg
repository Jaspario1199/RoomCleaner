<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="842" viewBox="0 0 1190 842"><rect width="100%" height="100%" fill="white"/><text x="35" y="36" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#155ca2" text-anchor="start">ROOMCLEANER / MOTOR STATION</text><text x="35" y="70" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#172b3a" text-anchor="start">Control circuit, switch, and motor</text><text x="35" y="94" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#566573" text-anchor="start">U2B and U3B are the SAME physical boards as U2A/U3A on sheet 1. No extra ESP32 or driver is implied.</text><line x1="35" y1="108" x2="1155" y2="108" stroke="#155ca2" stroke-width="1.5"/><text x="1155" y="36" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="end">REV D | 2026-10-21 | SHEET 2/5</text><text x="35" y="813" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#aa2525" text-anchor="start">BUILD DRAWING - check every connection with a meter before first power. Never plug/unplug the motor with power on.</text><text x="1155" y="813" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="end">Symbols are functional; use module pin labels, not drawing position.</text><rect x="40" y="218" width="245" height="215" fill="#f5f8fa" stroke="#172b3a" stroke-width="1.3"/><text x="162" y="244" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#172b3a" text-anchor="middle">U2B  XIAO ESP32-C3</text><rect x="650" y="150" width="260" height="455" fill="#f5f8fa" stroke="#172b3a" stroke-width="1.3"/><text x="780" y="178" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#172b3a" text-anchor="middle">U3B  A4988 CARRIER</text><text x="780" y="198" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="middle">Use printed carrier pin names</text><text x="420" y="134" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155ca2" text-anchor="start">+3V3 from XIAO</text><line x1="440" y1="145" x2="440" y2="230" stroke="#155ca2" stroke-width="1.5"/><line x1="440" y1="230" x2="650" y2="230" stroke="#155ca2" stroke-width="1.5"/><text x="664" y="234" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">VDD</text><line x1="440" y1="230" x2="440" y2="460" stroke="#155ca2" stroke-width="1.5"/><line x1="440" y1="460" x2="650" y2="460" stroke="#155ca2" stroke-width="1.5"/><line x1="440" y1="490" x2="650" y2="490" stroke="#155ca2" stroke-width="1.5"/><line x1="440" y1="460" x2="440" y2="490" stroke="#155ca2" stroke-width="1.5"/><circle cx="440" cy="230" r="3" fill="#172b3a" stroke="#172b3a"/><circle cx="440" cy="460" r="3" fill="#172b3a" stroke="#172b3a"/><text x="664" y="464" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#172b3a" text-anchor="start">RESET (LOW = reset)</text><text x="664" y="494" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#172b3a" text-anchor="start">SLEEP (LOW = sleep)</text><line x1="520" y1="230" x2="520" y2="215" stroke="#172b3a" stroke-width="1.5"/><circle cx="520" cy="212" r="3" fill="white" stroke="#172b3a"/><text x="527" y="212" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">TP4</text><text x="272" y="284" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="end">D1 / GPIO3</text><line x1="285" y1="280" x2="433" y2="280" stroke="#172b3a" stroke-width="1.5"/><line x1="433" y1="280" x2="436" y2="273" stroke="#172b3a" stroke-width="1.5"/><line x1="436" y1="273" x2="444" y2="273" stroke="#172b3a" stroke-width="1.5"/><line x1="444" y1="273" x2="447" y2="280" stroke="#172b3a" stroke-width="1.5"/><line x1="447" y1="280" x2="650" y2="280" stroke="#172b3a" stroke-width="1.5"/><text x="664" y="284" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">STEP</text><text x="272" y="334" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="end">D2 / GPIO4</text><line x1="285" y1="330" x2="433" y2="330" stroke="#172b3a" stroke-width="1.5"/><line x1="433" y1="330" x2="436" y2="323" stroke="#172b3a" stroke-width="1.5"/><line x1="436" y1="323" x2="444" y2="323" stroke="#172b3a" stroke-width="1.5"/><line x1="444" y1="323" x2="447" y2="330" stroke="#172b3a" stroke-width="1.5"/><line x1="447" y1="330" x2="650" y2="330" stroke="#172b3a" stroke-width="1.5"/><text x="664" y="334" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">DIR</text><text x="272" y="384" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="end">D3 / GPIO5</text><line x1="285" y1="380" x2="433" y2="380" stroke="#172b3a" stroke-width="1.5"/><line x1="433" y1="380" x2="436" y2="373" stroke="#172b3a" stroke-width="1.5"/><line x1="436" y1="373" x2="444" y2="373" stroke="#172b3a" stroke-width="1.5"/><line x1="444" y1="373" x2="447" y2="380" stroke="#172b3a" stroke-width="1.5"/><line x1="447" y1="380" x2="650" y2="380" stroke="#172b3a" stroke-width="1.5"/><text x="664" y="384" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">ENABLE</text><text x="300" y="259" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#566573" text-anchor="start">Crossings without dots do not connect.</text><text x="485" y="274" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155ca2" text-anchor="start">STEP</text><text x="485" y="324" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155ca2" text-anchor="start">DIR</text><text x="485" y="374" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155ca2" text-anchor="start">ENABLE</text><text x="300" y="525" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#172b3a" text-anchor="start">BIAS RESISTORS (same named nets)</text><line x1="330" y1="550" x2="330" y2="560" stroke="#172b3a" stroke-width="1.5"/><rect x="325" y="560" width="10" height="30" fill="none" stroke="#172b3a" stroke-width="1.3"/><line x1="330" y1="590" x2="330" y2="600" stroke="#172b3a" stroke-width="1.5"/><text x="340" y="572" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#172b3a" text-anchor="start">R1</text><text x="340" y="586" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">10k</text><text x="310" y="544" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155ca2" text-anchor="start">+3V3</text><text x="306" y="618" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#155ca2" text-anchor="start">ENABLE</text><line x1="440" y1="550" x2="440" y2="560" stroke="#172b3a" stroke-width="1.5"/><rect x="435" y="560" width="10" height="30" fill="none" stroke="#172b3a" stroke-width="1.3"/><line x1="440" y1="590" x2="440" y2="600" stroke="#172b3a" stroke-width="1.5"/><text x="450" y="572" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#172b3a" text-anchor="start">R2</text><text x="450" y="586" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">10k</text><text x="420" y="544" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155ca2" text-anchor="start">STEP</text><line x1="440" y1="600" x2="440" y2="610" stroke="#172b3a" stroke-width="1.5"/><line x1="428" y1="610" x2="452" y2="610" stroke="#172b3a" stroke-width="1.5"/><line x1="432" y1="615" x2="448" y2="615" stroke="#172b3a" stroke-width="1.5"/><line x1="437" y1="620" x2="443" y2="620" stroke="#172b3a" stroke-width="1.5"/><line x1="550" y1="550" x2="550" y2="560" stroke="#172b3a" stroke-width="1.5"/><rect x="545" y="560" width="10" height="30" fill="none" stroke="#172b3a" stroke-width="1.3"/><line x1="550" y1="590" x2="550" y2="600" stroke="#172b3a" stroke-width="1.5"/><text x="560" y="572" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#172b3a" text-anchor="start">R3</text><text x="560" y="586" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">10k</text><text x="530" y="544" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155ca2" text-anchor="start">DIR</text><line x1="550" y1="600" x2="550" y2="610" stroke="#172b3a" stroke-width="1.5"/><line x1="538" y1="610" x2="562" y2="610" stroke="#172b3a" stroke-width="1.5"/><line x1="542" y1="615" x2="558" y2="615" stroke="#172b3a" stroke-width="1.5"/><line x1="547" y1="620" x2="553" y2="620" stroke="#172b3a" stroke-width="1.5"/><text x="300" y="683" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#172b3a" text-anchor="start">R1 holds ENABLE HIGH (disabled).</text><text x="300" y="701" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">R2/R3 hold STEP/DIR LOW at boot.</text><line x1="610" y1="525" x2="650" y2="525" stroke="#172b3a" stroke-width="1.5"/><text x="664" y="529" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#172b3a" text-anchor="start">MS1</text><line x1="610" y1="550" x2="650" y2="550" stroke="#172b3a" stroke-width="1.5"/><text x="664" y="554" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#172b3a" text-anchor="start">MS2</text><line x1="610" y1="575" x2="650" y2="575" stroke="#172b3a" stroke-width="1.5"/><text x="664" y="579" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#172b3a" text-anchor="start">MS3</text><line x1="610" y1="525" x2="610" y2="620" stroke="#172b3a" stroke-width="1.5"/><circle cx="610" cy="550" r="3" fill="#172b3a" stroke="#172b3a"/><circle cx="610" cy="575" r="3" fill="#172b3a" stroke="#172b3a"/><line x1="610" y1="620" x2="610" y2="630" stroke="#172b3a" stroke-width="1.5"/><line x1="598" y1="630" x2="622" y2="630" stroke="#172b3a" stroke-width="1.5"/><line x1="602" y1="635" x2="618" y2="635" stroke="#172b3a" stroke-width="1.5"/><line x1="607" y1="640" x2="613" y2="640" stroke="#172b3a" stroke-width="1.5"/><text x="480" y="650" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">All three LOW = full-step</text><text x="780" y="640" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="middle">Both GND pins connect to common GND.</text><text x="780" y="659" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="middle">VMOT and its GND are on sheet 1.</text><line x1="780" y1="605" x2="780" y2="615" stroke="#172b3a" stroke-width="1.5"/><line x1="780" y1="615" x2="780" y2="625" stroke="#172b3a" stroke-width="1.5"/><line x1="768" y1="625" x2="792" y2="625" stroke="#172b3a" stroke-width="1.5"/><line x1="772" y1="630" x2="788" y2="630" stroke="#172b3a" stroke-width="1.5"/><line x1="777" y1="635" x2="783" y2="635" stroke="#172b3a" stroke-width="1.5"/><text x="780" y="593" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="middle">GND (beside VDD)</text><text x="896" y="274" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="end">1A</text><line x1="910" y1="270" x2="1040" y2="270" stroke="#172b3a" stroke-width="1.5"/><circle cx="985" cy="270" r="3" fill="white" stroke="#172b3a"/><text x="896" y="339" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="end">1B</text><line x1="910" y1="335" x2="1040" y2="335" stroke="#172b3a" stroke-width="1.5"/><circle cx="985" cy="335" r="3" fill="white" stroke="#172b3a"/><text x="896" y="434" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="end">2A</text><line x1="910" y1="430" x2="1040" y2="430" stroke="#172b3a" stroke-width="1.5"/><circle cx="985" cy="430" r="3" fill="white" stroke="#172b3a"/><text x="896" y="499" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="end">2B</text><line x1="910" y1="495" x2="1040" y2="495" stroke="#172b3a" stroke-width="1.5"/><circle cx="985" cy="495" r="3" fill="white" stroke="#172b3a"/><text x="970" y="235" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">J2  MOTOR</text><text x="1040" y="217" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#172b3a" text-anchor="start">M1  NEMA17</text><path d="M1040 270.0 C1062 270.0 1062 286.25 1040 286.25" fill="none" stroke="#172b3a" stroke-width="1.5"/><path d="M1040 286.25 C1062 286.25 1062 302.5 1040 302.5" fill="none" stroke="#172b3a" stroke-width="1.5"/><path d="M1040 302.5 C1062 302.5 1062 318.75 1040 318.75" fill="none" stroke="#172b3a" stroke-width="1.5"/><path d="M1040 318.75 C1062 318.75 1062 335.0 1040 335.0" fill="none" stroke="#172b3a" stroke-width="1.5"/><path d="M1040 430.0 C1062 430.0 1062 446.25 1040 446.25" fill="none" stroke="#172b3a" stroke-width="1.5"/><path d="M1040 446.25 C1062 446.25 1062 462.5 1040 462.5" fill="none" stroke="#172b3a" stroke-width="1.5"/><path d="M1040 462.5 C1062 462.5 1062 478.75 1040 478.75" fill="none" stroke="#172b3a" stroke-width="1.5"/><path d="M1040 478.75 C1062 478.75 1062 495.0 1040 495.0" fill="none" stroke="#172b3a" stroke-width="1.5"/><text x="1070" y="308" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">Coil A</text><text x="1070" y="468" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">Coil B</text><text x="950" y="540" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">No motor wire goes to</text><text x="950" y="558" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">+12V or GND directly.</text><text x="55" y="420" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">D10 / GPIO10</text><line x1="125" y1="433" x2="125" y2="600" stroke="#172b3a" stroke-width="1.5"/><circle cx="125" cy="555" r="3" fill="#172b3a" stroke="#172b3a"/><line x1="125" y1="555" x2="200" y2="555" stroke="#172b3a" stroke-width="1.5"/><line x1="200" y1="505" x2="200" y2="515" stroke="#172b3a" stroke-width="1.5"/><rect x="195" y="515" width="10" height="30" fill="none" stroke="#172b3a" stroke-width="1.3"/><line x1="200" y1="545" x2="200" y2="555" stroke="#172b3a" stroke-width="1.5"/><text x="210" y="527" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#172b3a" text-anchor="start">R4</text><text x="210" y="541" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">10k</text><text x="175" y="492" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155ca2" text-anchor="start">+3V3</text><circle cx="125" cy="600" r="4" fill="white" stroke="#172b3a"/><text x="137" y="605" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">J3-1 / NC</text><line x1="125" y1="604" x2="125" y2="620" stroke="#172b3a" stroke-width="1.5"/><circle cx="125" cy="620" r="3" fill="white" stroke="#172b3a"/><line x1="125" y1="620" x2="145" y2="650" stroke="#172b3a" stroke-width="1.5"/><circle cx="145" cy="650" r="3" fill="white" stroke="#172b3a"/><text x="175" y="636" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">S1 KW12-3</text><text x="175" y="655" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">NC closed at rest</text><line x1="145" y1="654" x2="145" y2="680" stroke="#172b3a" stroke-width="1.5"/><line x1="145" y1="680" x2="145" y2="690" stroke="#172b3a" stroke-width="1.5"/><line x1="133" y1="690" x2="157" y2="690" stroke="#172b3a" stroke-width="1.5"/><line x1="137" y1="695" x2="153" y2="695" stroke="#172b3a" stroke-width="1.5"/><line x1="142" y1="700" x2="148" y2="700" stroke="#172b3a" stroke-width="1.5"/><text x="175" y="681" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">COM -&gt; GND (J3-2)</text><text x="45" y="719" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">NO unused. INPUT_PULLUP in firmware.</text><text x="45" y="738" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">R4 is an added external pull-up; the earlier test used only the ESP32 internal pull-up. Short/open switch detection is not equivalent:</text><text x="45" y="758" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">open wire reads STOP; a short to GND can falsely read READY. Test both switch states and unplug detection before motion.</text></svg>