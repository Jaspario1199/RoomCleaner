<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="842" viewBox="0 0 1190 842"><rect width="100%" height="100%" fill="white"/><text x="35" y="36" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#155ca2" text-anchor="start">ROOMCLEANER / MOTOR STATION</text><text x="35" y="70" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#172b3a" text-anchor="start">Encoder, motor current (1.35 A) and microstep</text><text x="35" y="94" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#566573" text-anchor="start">Rev D additions. U2C / U3C are the SAME XIAO and A4988 as sheets 1-2. Encoder I2C uses the pins Rev C reserved.</text><line x1="35" y1="108" x2="1155" y2="108" stroke="#155ca2" stroke-width="1.5"/><text x="1155" y="36" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="end">REV D | 2026-10-21 | SHEET 3/5</text><text x="35" y="813" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#aa2525" text-anchor="start">BUILD DRAWING - check every connection with a meter before first power. Never plug/unplug the motor with power on.</text><text x="1155" y="813" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="end">Symbols are functional; use module pin labels, not drawing position.</text><rect x="40" y="150" width="250" height="250" fill="#f5f8fa" stroke="#172b3a" stroke-width="1.3"/><text x="165" y="176" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#172b3a" text-anchor="middle">U2C  XIAO ESP32-C3</text><text x="277" y="219" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="end">D4 / GPIO6  (SDA)</text><text x="277" y="269" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="end">D5 / GPIO7  (SCL)</text><text x="277" y="319" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="end">3V3 OUT</text><text x="277" y="369" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="end">GND</text><rect x="640" y="150" width="250" height="300" fill="#f5f8fa" stroke="#172b3a" stroke-width="1.3"/><text x="765" y="176" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#172b3a" text-anchor="middle">U4  AS5600 ENCODER BOARD</text><text x="765" y="196" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="middle">Use the printed board pin names</text><text x="654" y="219" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">SDA</text><text x="654" y="269" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">SCL</text><text x="654" y="319" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">VCC</text><text x="654" y="369" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">GND</text><text x="654" y="409" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">DIR</text><text x="654" y="439" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">OUT / PGO</text><line x1="290" y1="215" x2="640" y2="215" stroke="#155ca2" stroke-width="1.5"/><text x="400" y="204" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155ca2" text-anchor="start">SDA</text><line x1="290" y1="265" x2="640" y2="265" stroke="#155ca2" stroke-width="1.5"/><text x="400" y="254" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155ca2" text-anchor="start">SCL</text><line x1="290" y1="315" x2="640" y2="315" stroke="#155ca2" stroke-width="1.5"/><text x="400" y="304" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155ca2" text-anchor="start">+3V3</text><line x1="290" y1="365" x2="640" y2="365" stroke="#172b3a" stroke-width="1.5"/><text x="400" y="354" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">GND</text><line x1="560" y1="365" x2="560" y2="405" stroke="#172b3a" stroke-width="1.5"/><line x1="560" y1="405" x2="640" y2="405" stroke="#172b3a" stroke-width="1.5"/><circle cx="560" cy="365" r="3" fill="#172b3a" stroke="#172b3a"/><line x1="600" y1="435" x2="640" y2="435" stroke="#172b3a" stroke-width="1.5"/><text x="560" y="439" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="end">not connected</text><text x="905" y="215" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Address 0x36, I2C 400 kHz (firmware).</text><text x="905" y="240" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">Pull-ups must go to 3.3 V only.</text><text x="905" y="260" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Board pull-ups (usually 4.7k) to its VCC are fine</text><text x="905" y="278" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">because VCC = 3.3 V. Never 5 V on ESP32 pins.</text><text x="905" y="305" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">If the board has a 3.3V / 5V jumper or</text><text x="905" y="323" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">solder pad, set it to 3.3 V.</text><text x="905" y="350" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">DIR to GND fixes the count direction;</text><text x="905" y="368" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">firmware enc_sign handles the sign.</text><text x="905" y="395" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Magnet: diametric disc on the spool axis,</text><text x="905" y="413" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">about 0.5-3 mm above the chip, centred.</text><text x="905" y="440" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Keep SDA/SCL/3V3/GND short (&lt; 20 cm),</text><text x="905" y="458" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">twisted together, away from motor wires.</text><rect x="40" y="490" width="540" height="290" fill="#fff7f0" stroke="#d9a27a" stroke-width="1.3"/><text x="55" y="516" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#aa2525" text-anchor="start">A4988 CURRENT LIMIT - DECISION D29: 1.35 A (vented shells)</text><text x="55" y="542" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#172b3a" text-anchor="start">Vref = 8 x I x Rsense      I = 1.35 A</text><rect x="55" y="556" width="510" height="26" fill="#e9f0f5" stroke="#bdccd6" stroke-width="1.3"/><text x="63" y="576" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">SENSE RESISTOR MARKING</text><text x="283" y="576" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">Rsense</text><text x="413" y="576" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">SET Vref TO</text><rect x="55" y="582" width="510" height="26" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="1.3"/><text x="63" y="602" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">R100</text><text x="283" y="602" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">0.100 ohm</text><text x="413" y="602" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">1.08 V</text><text x="63" y="628" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">R050</text><text x="283" y="628" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">0.050 ohm</text><text x="413" y="628" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">0.54 V</text><rect x="55" y="634" width="510" height="26" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="1.3"/><text x="63" y="654" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">R200</text><text x="283" y="654" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">0.200 ohm</text><text x="413" y="654" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">2.16 V</text><text x="55" y="680" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Measure: black probe on driver GND, red on the trim pot (or Vref pad).</text><text x="55" y="698" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">12V on, motor DISCONNECTED, logic powered. Turn the pot in small steps.</text><text x="55" y="716" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Read both small resistors near the motor pins before choosing a row.</text><text x="55" y="734" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">Heatsink stays on. Confirm with the 60 min hold test:</text><text x="55" y="752" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">driver heatsink &lt; ~70 C, else drop to 1.25 A (R100: 1.00 V).</text><rect x="600" y="490" width="555" height="290" fill="#f5f8fa" stroke="#bdccd6" stroke-width="1.3"/><text x="615" y="516" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#172b3a" text-anchor="start">MICROSTEP JUMPERS (MS1 / MS2 / MS3)</text><rect x="615" y="530" width="525" height="26" fill="#e9f0f5" stroke="#bdccd6" stroke-width="1.3"/><text x="623" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">MODE</text><text x="828" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">MS1</text><text x="898" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">MS2</text><text x="968" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">MS3</text><text x="1038" y="550" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">config</text><rect x="615" y="556" width="525" height="26" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="1.3"/><text x="623" y="576" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Full step (current config)</text><text x="828" y="576" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">GND</text><text x="898" y="576" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">GND</text><text x="968" y="576" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">GND</text><text x="1038" y="576" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">1</text><text x="623" y="602" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">1/16 step (smoother)</text><text x="828" y="602" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">+3V3</text><text x="898" y="602" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">+3V3</text><text x="968" y="602" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">+3V3</text><text x="1038" y="602" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">16</text><text x="615" y="632" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Hardware and config MUST match: the host converts cable length</text><text x="615" y="650" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">to steps with config &quot;microsteps&quot;. Mismatch = wrong lengths.</text><text x="615" y="676" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Full step (all LOW) is what config/robot.example.json uses now.</text><text x="615" y="702" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">If you solder MS pins to +3V3, change &quot;microsteps&quot; to 16</text><text x="615" y="720" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">for that station before the first run.</text></svg>