nt returns straight to J1-2.</text><rect x="245" y="340" width="250" height="110" fill="#f5f8fa" stroke="#172b3a" stroke-width="1.3"/><text x="370" y="363" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#172b3a" text-anchor="middle">U1  DROK BUCK</text><line x1="205" y1="385" x2="245" y2="385" stroke="#172b3a" stroke-width="1.5"/><text x="257" y="389" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#172b3a" text-anchor="start">IN+</text><line x1="205" y1="385" x2="205" y2="205" stroke="#172b3a" stroke-width="1.5"/><circle cx="205" cy="205" r="3" fill="#172b3a" stroke="#172b3a"/><line x1="205" y1="425" x2="245" y2="425" stroke="#172b3a" stroke-width="1.5"/><text x="257" y="429" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#172b3a" text-anchor="start">IN-</text><line x1="205" y1="425" x2="205" y2="490" stroke="#172b3a" stroke-width="1.5"/><circle cx="205" cy="490" r="3" fill="#172b3a" stroke="#172b3a"/><line x1="495" y1="385" x2="535" y2="385" stroke="#172b3a" stroke-width="1.5"/><text x="482" y="389" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#172b3a" text-anchor="end">OUT+</text><text x="520" y="407" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#096a50" text-anchor="start">+5_BUCK</text><line x1="495" y1="425" x2="535" y2="425" stroke="#172b3a" stroke-width="1.5"/><text x="482" y="429" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#172b3a" text-anchor="end">OUT-</text><line x1="535" y1="425" x2="535" y2="490" stroke="#172b3a" stroke-width="1.5"/><circle cx="535" cy="490" r="3" fill="#172b3a" stroke="#172b3a"/><text x="370" y="399" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="middle">Adjust to 5.00V</text><text x="370" y="420" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="middle">Non-isolated: IN- = OUT-</text><line x1="330" y1="450" x2="330" y2="465" stroke="#172b3a" stroke-width="1.5"/><line x1="326" y1="461" x2="334" y2="469" stroke="#172b3a" stroke-width="1.5"/><line x1="326" y1="469" x2="334" y2="461" stroke="#172b3a" stroke-width="1.5"/><text x="250" y="480" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">EN left unconnected externally</text><line x1="550" y1="385" x2="550" y2="370" stroke="#172b3a" stroke-width="1.5"/><circle cx="550" cy="367" r="3" fill="white" stroke="#172b3a"/><text x="557" y="367" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">TP2</text><line x1="535" y1="385" x2="600" y2="385" stroke="#096a50" stroke-width="1.5"/><line x1="600" y1="385" x2="616" y2="385" stroke="#096a50" stroke-width="1.5"/><line x1="616" y1="375" x2="616" y2="395" stroke="#172b3a" stroke-width="1.5"/><line x1="616" y1="395" x2="633" y2="385" stroke="#172b3a" stroke-width="1.5"/><line x1="633" y1="385" x2="616" y2="375" stroke="#172b3a" stroke-width="1.5"/><line x1="635" y1="373" x2="635" y2="397" stroke="#172b3a" stroke-width="1.5"/><line x1="635" y1="373" x2="640" y2="373" stroke="#172b3a" stroke-width="1.5"/><line x1="630" y1="397" x2="635" y2="397" stroke="#172b3a" stroke-width="1.5"/><line x1="635" y1="385" x2="705" y2="385" stroke="#096a50" stroke-width="1.5"/><text x="622" y="342" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="middle">D1  1N5819</text><text x="602" y="365" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">A</text><text x="643" y="365" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">K / stripe</text><text x="622" y="416" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="middle">Stripe faces XIAO</text><circle cx="705" cy="385" r="3" fill="white" stroke="#172b3a"/><circle cx="745" cy="385" r="3" fill="white" stroke="#172b3a"/><line x1="708" y1="382" x2="738" y2="366" stroke="#172b3a" stroke-width="1.5"/><text x="725" y="337" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="middle">JP1</text><text x="725" y="354" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#172b3a" text-anchor="middle">REMOVABLE LINK</text><line x1="748" y1="385" x2="870" y2="385" stroke="#096a50" stroke-width="1.5"/><line x1="815" y1="385" x2="815" y2="370" stroke="#172b3a" stroke-width="1.5"/><circle cx="815" cy="367" r="3" fill="white" stroke="#172b3a"/><text x="822" y="367" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">TP3</text><rect x="870" y="360" width="245" height="90" fill="#f5f8fa" stroke="#172b3a" stroke-width="1.3"/><text x="993" y="381" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#172b3a" text-anchor="middle">U2A  XIAO ESP32-C3</text><text x="882" y="401" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">5V / VBUS</text><text x="882" y="435" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">GND</text><line x1="850" y1="431" x2="870" y2="431" stroke="#172b3a" stroke-width="1.5"/><line x1="850" y1="431" x2="850" y2="490" stroke="#172b3a" stroke-width="1.5"/><circle cx="850" cy="490" r="3" fill="#172b3a" stroke="#172b3a"/><text x="1000" y="435" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">3V3 OUT</text><line x1="1115" y1="431" x2="1140" y2="431" stroke="#172b3a" stroke-width="1.5"/><line x1="1140" y1="431" x2="1140" y2="470" stroke="#172b3a" stroke-width="1.5"/><text x="1000" y="472" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#155ca2" text-anchor="start">+3V3 (sheet 2)</text><text x="40" y="548" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#aa2525" text-anchor="start">USB / EXTERNAL POWER RULE</text><text x="40" y="570" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">USB plugged in: JP1 OPEN. Standalone from 12V: USB unplugged, JP1 CLOSED. Change JP1 only with all power off.</text><text x="40" y="589" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">The diode blocks backfeed into the buck; it is not a complete two-source power selector or 12V overvoltage protector.</text><rect x="35" y="612" width="1120" height="165" fill="#f5f8fa" stroke="#bdccd6" stroke-width="1.3"/><text x="50" y="634" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">SUPPLY DISTRIBUTION - branch fuses before long cables</text><text x="50" y="660" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">ALITOVE 12V / 6A</text><line x1="180" y1="655" x2="215" y2="655" stroke="#aa2525" stroke-width="1.5"/><rect x="215" y="648" width="45" height="14" fill="none" stroke="#172b3a" stroke-width="1.3"/><text x="237" y="643" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#172b3a" text-anchor="middle">F0</text><text x="237" y="682" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="middle">7.5A existing*</text><line x1="260" y1="655" x2="330" y2="655" stroke="#aa2525" stroke-width="1.5"/><line x1="330" y1="655" x2="330" y2="750" stroke="#aa2525" stroke-width="1.5"/><circle cx="330" cy="655" r="3" fill="#172b3a" stroke="#172b3a"/><line x1="330" y1="655" x2="380" y2="655" stroke="#aa2525" stroke-width="1.5"/><rect x="380" y="649" width="35" height="12" fill="none" stroke="#172b3a" stroke-width="1.3"/><text x="397" y="646" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#172b3a" text-anchor="middle">F1</text><line x1="415" y1="655" x2="505" y2="655" stroke="#aa2525" stroke-width="1.5"/><text x="515" y="659" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">Station 1: positive conductor to J1-1; fuse rating TBD</text><circle cx="330" cy="685" r="3" fill="#172b3a" stroke="#172b3a"/><line x1="330" y1="685" x2="380" y2="685" stroke="#aa2525" stroke-width="1.5"/><rect x="380" y="679" width="35" height="12" fill="none" stroke="#172b3a" stroke-width="1.3"/><text x="397" y="676" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#172b3a" text-anchor="middle">F2</text><line x1="415" y1="685" x2="505" y2="685" stroke="#aa2525" stroke-width="1.5"/><text x="515" y="689" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">Station 2: positive conductor to J1-1; fuse rating TBD</text><circle cx="330" cy="715" r="3" fill="#172b3a" stroke="#172b3a"/><line x1="330" y1="715" x2="380" y2="715" stroke="#aa2525" stroke-width="1.5"/><rect x="380" y="709" width="35" height="12" fill="none" stroke="#172b3a" stroke-width="1.3"/><text x="397" y="706" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#172b3a" text-anchor="middle">F3</text><line x1="415" y1="715" x2="505" y2="715" stroke="#aa2525" stroke-width="1.5"/><text x="515" y="719" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">Station 3: positive conductor to J1-1; fuse rating TBD</text><circle cx="330" cy="745" r="3" fill="#172b3a" stroke="#172b3a"/><line x1="330" y1="745" x2="380" y2="745" stroke="#aa2525" stroke-width="1.5"/><rect x="380" y="739" width="35" height="12" fill="none" stroke="#172b3a" stroke-width="1.3"/><text x="397" y="736" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#172b3a" text-anchor="middle">F4</text><line x1="415" y1="745" x2="505" y2="745" stroke="#aa2525" stroke-width="1.5"/><text x="515" y="749" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">Station 4: positive conductor to J1-1; fuse rating TBD</text><text x="835" y="658" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">Supply negative splits to</text><text x="835" y="677" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">each station J1-2.</text><text x="835" y="705" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#aa2525" text-anchor="start">* F0 is recorded, not approved</text><text x="835" y="722" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">for unknown wire sizes.</text><text x="835" y="742" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">6A total capacity still needs testing.</text></svg>