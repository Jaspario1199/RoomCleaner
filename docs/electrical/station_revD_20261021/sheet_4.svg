<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="842" viewBox="0 0 1190 842"><rect width="100%" height="100%" fill="white"/><text x="35" y="36" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#155ca2" text-anchor="start">ROOMCLEANER / MOTOR STATION</text><text x="35" y="70" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#172b3a" text-anchor="start">Connection ledger and meter checks</text><text x="35" y="94" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#566573" text-anchor="start">This sheet is the exact connectivity reference. Net names repeat across sheets. Measure at labeled test points rather than crowded pins.</text><line x1="35" y1="108" x2="1155" y2="108" stroke="#155ca2" stroke-width="1.5"/><text x="1155" y="36" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="end">REV D | 2026-10-21 | SHEET 4/5</text><text x="35" y="813" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#aa2525" text-anchor="start">BUILD DRAWING - check every connection with a meter before first power. Never plug/unplug the motor with power on.</text><text x="1155" y="813" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="end">Symbols are functional; use module pin labels, not drawing position.</text><rect x="35" y="130" width="1120" height="26" fill="#e9f0f5" stroke="#bdccd6" stroke-width="1.3"/><text x="43" y="150" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">NET / FUNCTION</text><text x="223" y="150" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">ALL CONNECTED POINTS</text><rect x="35" y="156" width="1120" height="26" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="1.3"/><text x="43" y="176" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">+12_STATION</text><text x="223" y="176" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">J1-1; buck IN+; A4988 VMOT; C1 positive; TP1</text><text x="43" y="202" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">GND / 0V</text><text x="223" y="202" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">J1-2; buck IN-/OUT-; XIAO GND; both A4988 GND pins; C1 negative; TP0</text><rect x="35" y="208" width="1120" height="26" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="1.3"/><text x="43" y="228" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">GND (continued)</text><text x="223" y="228" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">A4988 MS1/MS2/MS3 (full step); R2/R3 lower ends; switch COM (J3-2); AS5600 GND and DIR</text><text x="43" y="254" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">SDA / SCL</text><text x="223" y="254" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">XIAO D4 / GPIO6 to AS5600 SDA;  XIAO D5 / GPIO7 to AS5600 SCL (3.3 V pull-ups only)</text><rect x="35" y="260" width="1120" height="26" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="1.3"/><text x="43" y="280" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">+5_BUCK</text><text x="223" y="280" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Buck OUT+; D1 anode (unstriped); TP2</text><text x="43" y="306" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">DIODE OUTPUT</text><text x="223" y="306" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">D1 cathode (striped); JP1 buck-side contact</text><rect x="35" y="312" width="1120" height="26" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="1.3"/><text x="43" y="332" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">XIAO_5V</text><text x="223" y="332" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">JP1 XIAO-side contact; XIAO 5V/VBUS; TP3 (USB VBUS is on this board net)</text><text x="43" y="358" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">+3V3</text><text x="223" y="358" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">XIAO 3V3 OUT; A4988 VDD/RESET/SLEEP; R1/R4 upper ends; AS5600 VCC; TP4</text><rect x="35" y="364" width="1120" height="26" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="1.3"/><text x="43" y="384" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">STEP</text><text x="223" y="384" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">XIAO D1 / GPIO3; A4988 STEP; R2 upper end</text><text x="43" y="410" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">DIR</text><text x="223" y="410" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">XIAO D2 / GPIO4; A4988 DIR; R3 upper end</text><rect x="35" y="416" width="1120" height="26" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="1.3"/><text x="43" y="436" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">ENABLE</text><text x="223" y="436" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">XIAO D3 / GPIO5; A4988 ENABLE; R1 lower end</text><text x="43" y="462" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">HOME_NC</text><text x="223" y="462" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">XIAO D10 / GPIO10; switch NC (J3-1); R4 lower end</text><rect x="35" y="468" width="1120" height="26" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="1.3"/><text x="43" y="488" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">MOTOR OUTPUTS</text><text x="223" y="488" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">1A/1B to one measured coil pair; 2A/2B to the other. No common rail connection.</text><text x="35" y="526" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#172b3a" text-anchor="start">POWER MODES - JP1 disconnects only the external positive feed; ground remains common.</text><rect x="35" y="540" width="1120" height="28" fill="#e9f0f5" stroke="#bdccd6" stroke-width="1.3"/><text x="43" y="560" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">MODE</text><text x="258" y="560" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">USB</text><text x="368" y="560" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">12V</text><text x="453" y="560" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">JP1</text><text x="553" y="560" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">RESULT</text><rect x="35" y="568" width="1120" height="28" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="1.3"/><text x="43" y="588" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">USB logic / upload</text><text x="258" y="588" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Connected</text><text x="368" y="588" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Off</text><text x="453" y="588" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">OPEN</text><text x="553" y="588" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">XIAO + driver logic powered; VMOT off</text><text x="43" y="616" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">USB motor bench test</text><text x="258" y="616" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Connected</text><text x="368" y="616" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">On</text><text x="453" y="616" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">OPEN</text><text x="553" y="616" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">USB powers logic; 12V powers motor and unloaded buck</text><rect x="35" y="624" width="1120" height="28" fill="#f5f8fa" stroke="#f5f8fa" stroke-width="1.3"/><text x="43" y="644" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Standalone station</text><text x="258" y="644" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Unplugged</text><text x="368" y="644" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">On</text><text x="453" y="644" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">CLOSED</text><text x="553" y="644" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Buck powers logic; 12V powers motor</text><text x="43" y="672" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Not allowed in this revision</text><text x="258" y="672" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Connected</text><text x="368" y="672" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">On</text><text x="453" y="672" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">CLOSED</text><text x="553" y="672" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">Two sources meet on VBUS; do not use this configuration</text><text x="35" y="714" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">DC VOLTAGE CHECKS: black probe at TP0 (J1 negative), red at the selected test point.</text><text x="35" y="736" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">TP1: ~12V with supply on. TP2: 5.00V before diode. TP3: ~USB voltage in USB mode, lower than TP2 through diode standalone.</text><text x="35" y="756" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">TP4: ~3.3V. RESET/SLEEP: ~3.3V. ENABLE: ~3.3V idle, near 0V during jog. HOME: near 0V released, ~3.3V pressed/open.</text><text x="35" y="778" font-family="Arial, sans-serif" font-size="11" font-weight="normal" fill="#172b3a" text-anchor="start">A normal meter cannot reliably resolve the short STEP pulse or the 0.4-second ENABLE window. Use scope/logic analyzer if needed.</text></svg>