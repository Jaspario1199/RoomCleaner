<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="842" viewBox="0 0 1190 842"><rect width="100%" height="100%" fill="white"/><text x="35" y="36" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#155ca2" text-anchor="start">ROOMCLEANER / MOTOR STATION</text><text x="35" y="70" font-family="Arial, sans-serif" font-size="25" font-weight="bold" fill="#172b3a" text-anchor="start">Power circuit - one station</text><text x="35" y="94" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#566573" text-anchor="start">Real wire connections, component symbols, and named nets. Filled dot = connected junction. Same net label = same electrical node.</text><line x1="35" y1="108" x2="1155" y2="108" stroke="#155ca2" stroke-width="1.5"/><text x="1155" y="36" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="end">REV D | 2026-10-21 | SHEET 1/5</text><text x="35" y="813" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#aa2525" text-anchor="start">BUILD DRAWING - check every connection with a meter before first power. Never plug/unplug the motor with power on.</text><text x="1155" y="813" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="end">Symbols are functional; use module pin labels, not drawing position.</text><text x="40" y="144" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#172b3a" text-anchor="start">J1  TWO-WIRE INPUT</text><text x="40" y="162" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">Branch fuse is at supply end (see below).</text><circle cx="55" cy="205" r="4" fill="white" stroke="#172b3a"/><text x="40" y="193" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#aa2525" text-anchor="start">1: +12V</text><circle cx="55" cy="490" r="4" fill="white" stroke="#172b3a"/><text x="40" y="478" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">2: RETURN</text><line x1="59" y1="205" x2="1000" y2="205" stroke="#aa2525" stroke-width="1.5"/><text x="290" y="199" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#aa2525" text-anchor="start">+12_STATION</text><line x1="145" y1="205" x2="145" y2="190" stroke="#172b3a" stroke-width="1.5"/><circle cx="145" cy="187" r="3" fill="white" stroke="#172b3a"/><text x="152" y="187" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">TP1</text><circle cx="580" cy="205" r="3" fill="#172b3a" stroke="#172b3a"/><line x1="580" y1="205" x2="580" y2="264" stroke="#172b3a" stroke-width="1.5"/><line x1="565" y1="264" x2="595" y2="264" stroke="#172b3a" stroke-width="1.5"/><line x1="565" y1="273" x2="595" y2="273" stroke="#172b3a" stroke-width="1.5"/><text x="557" y="257" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#aa2525" text-anchor="start">+</text><text x="600" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#172b3a" text-anchor="start">C1  100 uF / 50V</text><text x="600" y="285" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#172b3a" text-anchor="start">Striped negative lead below</text><line x1="580" y1="273" x2="580" y2="300" stroke="#172b3a" stroke-width="1.5"/><line x1="580" y1="300" x2="580" y2="310" stroke="#172b3a" stroke-width="1.5"/><line x1="568" y1="310" x2="592" y2="310" stroke="#172b3a" stroke-width="1.5"/><line x1="572" y1="315" x2="588" y2="315" stroke="#172b3a" stroke-width="1.5"/><line x1="577" y1="320" x2="583" y2="320" stroke="#172b3a" stroke-width="1.5"/><line x1="59" y1="490" x2="1148" y2="490" stroke="#172b3a" stroke-width="1.5"/><text x="420" y="511" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#172b3a" text-anchor="start">GND: common 0V, not a separate earth connection</text><line x1="145" 